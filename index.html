<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Электромонтаж дома PRO</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#eef2f7;color:#172033}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:9px 12px;cursor:pointer;background:#e2e8f0;color:#172033}button.primary{background:#2563eb;color:#fff}button.danger{background:#fee2e2;color:#b91c1c}.top{height:62px;background:#0f172a;color:#fff;display:flex;align-items:center;padding:0 16px;gap:10px}.logo{font-size:18px;font-weight:800}.spacer{flex:1}.app{display:flex;height:calc(100vh - 62px)}aside{width:235px;background:#fff;border-right:1px solid #dbe2ea;padding:12px;overflow:auto}.sec{font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;margin:14px 8px 7px}.nav{display:block;width:100%;text-align:left;background:#fff;margin:3px 0}.nav.active{background:#e8f0ff;color:#1d4ed8;font-weight:700}.main{flex:1;min-width:0;display:flex;flex-direction:column}.toolbar{height:58px;background:#fff;border-bottom:1px solid #dbe2ea;display:flex;align-items:center;gap:7px;padding:8px 12px;overflow:auto}.canvasWrap{flex:1;overflow:auto;background:#cbd5e1;padding:24px}.canvas{position:relative;width:1400px;height:850px;background:#fff;background-image:linear-gradient(#dbe4ee 1px,transparent 1px),linear-gradient(90deg,#dbe4ee 1px,transparent 1px);background-size:20px 20px;box-shadow:0 8px 30px #0002}.room{position:absolute;background:#fff;border:3px solid #475569;border-radius:5px;user-select:none;touch-action:none;cursor:move;z-index:5}.room.selected{border-color:#2563eb;box-shadow:0 0 0 3px #93c5fd}.rtitle{font-weight:800;padding:8px}.dims{padding:0 8px;color:#64748b;font-size:11px}.obj{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border:2px solid #334155;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;z-index:20;cursor:grab;touch-action:none;user-select:none;box-shadow:0 2px 5px #0002}.obj.selected{border-color:#2563eb;box-shadow:0 0 0 3px #93c5fd}.outlet{border-radius:50%}.light{border-radius:50%;background:#fef3c7}.switch{background:#e0e7ff}.junction{border-radius:50%;background:#fee2e2}.panel{background:#dcfce7}.cable{position:absolute;height:3px;background:#ef4444;transform-origin:0 50%;z-index:10;pointer-events:none}.right{width:290px;background:#fff;border-left:1px solid #dbe2ea;padding:14px;overflow:auto}.field{margin:10px 0}.field label{display:block;color:#64748b;font-size:12px;margin-bottom:4px}.field input,.field select{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:12px}.metric{font-size:25px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid #eee;text-align:left}.page{padding:18px;overflow:auto}.muted{color:#64748b}.tool{display:block;width:100%;text-align:left;margin:3px 0;background:#fff}.hint{background:#eff6ff;padding:10px;border-radius:9px;line-height:1.4;font-size:12px}
@media(max-width:900px){aside{display:none}.right{width:245px}.canvasWrap{padding:10px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.right{display:none}.top .logo{font-size:14px}.grid{grid-template-columns:1fr}.canvasWrap{padding:5px}}
</style></head><body>
<header class="top"><div class="logo">⚡ Электромонтаж дома PRO</div><div class="spacer"></div><button onclick="save()">💾 Сохранить</button><button class="primary" onclick="exportJSON()">Экспорт JSON</button></header>
<div class="app"><aside id="side"></aside><main class="main"><div class="toolbar" id="toolbar"></div><div class="canvasWrap" id="wrap"><div id="canvas" class="canvas"></div><div id="page" class="page"></div></div></main><section class="right"><h3>Свойства</h3><div id="props"><span class="muted">Выберите объект на плане.</span></div></section></div>
<script>
const KEY='electromontazh-pro-v6';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{tab:'plan',project:'Мой дом',voltage:230,reserve:15,zoom:1,next:1000,rooms:[{id:1,name:'Гостиная',x:50,y:50,w:330,h:220},{id:2,name:'Кухня',x:410,y:50,w:320,h:220},{id:3,name:'Спальня',x:50,y:310,w:330,h:220},{id:4,name:'Санузел',x:410,y:310,w:220,h:190}],objects:[{id:101,type:'outlet',name:'Розетка TV',x:180,y:170,power:200,count:1},{id:102,type:'outlet',name:'Кухонная розетка',x:520,y:170,power:400,count:3},{id:103,type:'light',name:'Светильник',x:215,y:105,power:20,count:4},{id:104,type:'switch',name:'Выключатель',x:85,y:125,power:0,count:1},{id:105,type:'junction',name:'Распаячная коробка',x:350,y:275,power:0,count:1},{id:106,type:'panel',name:'Электрощит',x:820,y:120,power:0,count:1}],connections:[]};
const TYPES={outlet:['🔌','Розетка'],light:['💡','Светильник'],switch:['🔘','Выключатель'],junction:['⬡','Распаячная коробка'],panel:['▣','Электрощит']};let drag=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state));status('Сохранено')}function status(t){let e=document.getElementById('status');if(e)e.textContent=t}function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}function sel(){if(!state.selected)return null;return state.selected.kind==='room'?state.rooms.find(r=>r.id===state.selected.id):state.objects.find(o=>o.id===state.selected.id)}
function addRoom(){let id=++state.next;state.rooms.push({id,name:'Новая комната',x:70,y:70,w:260,h:180});state.selected={kind:'room',id};save();render()}function addObj(type){let id=++state.next;state.objects.push({id,type,name:TYPES[type][1],x:200,y:180,power:type==='outlet'?200:0,count:1});state.selected={kind:'obj',id};save();render()}function duplicate(){let a=sel();if(!a)return;if(state.selected.kind==='room'){let n={...a,id:++state.next,x:a.x+30,y:a.y+30,name:a.name+' копия'};state.rooms.push(n);state.selected={kind:'room',id:n.id}}else{let n={...a,id:++state.next,x:a.x+35,y:a.y+35,name:a.name+' копия'};state.objects.push(n);state.selected={kind:'obj',id:n.id}}save();render()}
function remove(){if(!state.selected)return;if(state.selected.kind==='room')state.rooms=state.rooms.filter(x=>x.id!==state.selected.id);else{let id=state.selected.id;state.objects=state.objects.filter(x=>x.id!==id);state.connections=state.connections.filter(c=>c.a!==id&&c.b!==id)}state.selected=null;save();render()}function clearSel(){state.selected=null;render()}
function startDrag(ev,kind,id){ev.preventDefault();ev.stopPropagation();let a=kind==='room'?state.rooms.find(x=>x.id===id):state.objects.find(x=>x.id===id);state.selected={kind,id};drag={kind,id,startX:ev.clientX,startY:ev.clientY,x:a.x,y:a.y};try{ev.currentTarget.setPointerCapture(ev.pointerId)}catch(e){}renderObjectsOnly();renderProps()}
function pointerMove(ev){if(!drag)return;let a=drag.kind==='room'?state.rooms.find(x=>x.id===drag.id):state.objects.find(x=>x.id===drag.id);if(!a)return;let dx=(ev.clientX-drag.startX)/state.zoom,dy=(ev.clientY-drag.startY)/state.zoom;a.x=Math.max(0,Math.round(drag.x+dx));a.y=Math.max(0,Math.round(drag.y+dy));renderObjectsOnly();renderProps()}
function pointerUp(){if(drag){save();drag=null;status('Положение сохранено')}}document.addEventListener('pointermove',pointerMove);document.addEventListener('pointerup',pointerUp);
function renderObjectsOnly(){let c=document.getElementById('canvas');if(!c||state.tab!=='plan')return;c.querySelectorAll('.room').forEach(e=>{let r=state.rooms.find(x=>x.id==e.dataset.id);if(r){e.style.left=r.x+'px';e.style.top=r.y+'px';e.style.width=r.w+'px';e.style.height=r.h+'px';e.classList.toggle('selected',state.selected?.kind==='room'&&state.selected.id===r.id)}});c.querySelectorAll('.obj').forEach(e=>{let o=state.objects.find(x=>x.id==e.dataset.id);if(o){e.style.left=o.x+'px';e.style.top=o.y+'px';e.classList.toggle('selected',state.selected?.kind==='obj'&&state.selected.id===o.id)}});renderConnections()}
function renderConnections(){document.querySelectorAll('.cable').forEach(e=>e.remove());let c=document.getElementById('canvas');if(!c)return;state.connections.forEach(con=>{let a=state.objects.find(x=>x.id===con.a),b=state.objects.find(x=>x.id===con.b);if(!a||!b)return;let e=document.createElement('div'),dx=b.x-a.x,dy=b.y-a.y;e.className='cable';e.style.left=a.x+'px';e.style.top=a.y+'px';e.style.width=Math.hypot(dx,dy)+'px';e.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';c.appendChild(e)})}
function addConnection(){let a=state.selected?.kind==='obj'?state.selected.id:null;if(!a)return;let b=state.objects.find(o=>o.id!==a)?.id;if(b&&!state.connections.some(c=>(c.a===a&&c.b===b)||(c.a===b&&c.b===a)))state.connections.push({a,b});save();render()}function setProp(k,v){let a=sel();if(!a)return;a[k]=k==='name'?v:Number(v);save();render()}function changeType(v){let a=sel();if(a?.type){a.type=v;a.name=TYPES[v][1];save();render()}}
function side(){let items=[['dashboard','▦ Обзор'],['plan','⌗ План дома'],['calc','∑ Расчёты'],['panel','▣ Электрический щит'],['materials','▤ Материалы'],['settings','⚙ Настройки']];document.getElementById('side').innerHTML='<div class="sec">Проект</div>'+items.map(x=>`<button class="nav ${state.tab===x[0]?'active':''}" onclick="state.tab='${x[0]}';render()">${x[1]}</button>`).join('')+'<div class="sec">План</div><button class="tool" onclick="addRoom()">🏠 Комната</button><div class="sec">Электроточки</div>'+Object.keys(TYPES).map(k=>`<button class="tool" onclick="addObj('${k}')">${TYPES[k][0]} ${TYPES[k][1]}</button>`).join('')+'<div class="sec">Редактор</div><button class="tool" onclick="duplicate()">⧉ Дублировать</button><button class="tool" onclick="remove()">🗑 Удалить</button><button class="tool" onclick="clearSel()">↗ Снять выделение</button><button class="tool" onclick="addConnection()">🔴 Соединить кабелем</button><div class="sec">Подсказка</div><div class="hint">Зажмите объект и перетаскивайте мышью или пальцем. Справа доступны координаты, размеры, мощность и количество. Распаечные коробки, розетки, выключатели, светильники и щит можно соединять кабелем.</div>'}
function toolbar(){document.getElementById('toolbar').innerHTML=state.tab==='plan'?`<button onclick="changeZoom(-.1)">−</button><span id="zoom">${Math.round(state.zoom*100)}%</span><button onclick="changeZoom(.1)">＋</button><button onclick="center()">⌂ Центр</button><span id="status" class="muted">Готово</span>`:`<b>${pageTitle()}</b>`}function pageTitle(){return {dashboard:'Обзор',calc:'Расчёты',panel:'Электрический щит',materials:'Материалы',settings:'Настройки'}[state.tab]||'План дома'}
function renderPlan(){let c=document.getElementById('canvas');c.style.display='block';c.style.transform='scale('+state.zoom+')';c.style.transformOrigin='top left';c.innerHTML='';state.rooms.forEach(r=>{let e=document.createElement('div');e.className='room '+(state.selected?.kind==='room'&&state.selected.id===r.id?'selected':'');e.dataset.id=r.id;e.style.cssText=`left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`;e.innerHTML=`<div class="rtitle">${esc(r.name)}</div><div class="dims">${Math.round(r.w)} × ${Math.round(r.h)} мм</div>`;e.onpointerdown=ev=>startDrag(ev,'room',r.id);e.ondblclick=()=>{let n=prompt('Название комнаты',r.name);if(n){r.name=n;save();render()}};c.appendChild(e)});state.objects.forEach(o=>{let e=document.createElement('div');e.className='obj '+o.type+' '+(state.selected?.kind==='obj'&&state.selected.id===o.id?'selected':'');e.dataset.id=o.id;e.style.left=o.x+'px';e.style.top=o.y+'px';e.textContent=TYPES[o.type][0];e.title=o.name;e.onpointerdown=ev=>startDrag(ev,'obj',o.id);e.ondblclick=()=>{let n=prompt('Название',o.name);if(n){o.name=n;save();render()}};c.appendChild(e)});renderConnections()}
function renderProps(){let p=document.getElementById('props'),a=sel();if(!a){p.innerHTML='<span class="muted">Выберите объект на плане.</span>';return}if(state.selected.kind==='room')p.innerHTML=`<div class="field"><label>Название</label><input value="${esc(a.name)}" onchange="setProp('name',this.value)"></div><div class="field"><label>X, мм</label><input type=number value="${a.x}" onchange="setProp('x',this.value)"></div><div class="field"><label>Y, мм</label><input type=number value="${a.y}" onchange="setProp('y',this.value)"></div><div class="field"><label>Ширина, мм</label><input type=number value="${a.w}" onchange="setProp('w',this.value)"></div><div class="field"><label>Высота, мм</label><input type=number value="${a.h}" onchange="setProp('h',this.value)"></div><button class="danger" onclick="remove()">Удалить комнату</button>`;else p.innerHTML=`<div class="field"><label>Тип</label><select onchange="changeType(this.value)">${Object.keys(TYPES).map(k=>`<option value="${k}" ${a.type===k?'selected':''}>${TYPES[k][0]} ${TYPES[k][1]}</option>`).join('')}</select></div><div class="field"><label>Название</label><input value="${esc(a.name)}" onchange="setProp('name',this.value)"></div><div class="field"><label>X, мм</label><input type=number value="${a.x}" onchange="setProp('x',this.value)"></div><div class="field"><label>Y, мм</label><input type=number value="${a.y}" onchange="setProp('y',this.value)"></div><div class="field"><label>Мощность, Вт</label><input type=number value="${a.power||0}" onchange="setProp('power',this.value)"></div><div class="field"><label>Количество</label><input type=number value="${a.count||1}" onchange="setProp('count',this.value)"></div><button class="primary" onclick="addConnection()">🔴 Соединить с другой точкой</button><br><br><button class="danger" onclick="remove()">Удалить</button>`}
function calc(){let p=state.objects.reduce((s,o)=>s+(Number(o.power)||0)*(Number(o.count)||1),0),i=p/state.voltage,c=i<=10?1.5:i<=16?2.5:i<=25?4:i<=32?6:i<=40?10:16,b=[6,10,16,20,25,32,40,50,63,80,100].find(x=>x>=i)||100;return{p,i,c,b}}
function dashboard(){let c=calc();return `<div class="page"><h1>${esc(state.project)}</h1><div class="grid"><div class="card"><div class="muted">Комнаты</div><div class="metric">${state.rooms.length}</div></div><div class="card"><div class="muted">Электроточки</div><div class="metric">${state.objects.length}</div></div><div class="card"><div class="muted">Мощность</div><div class="metric">${c.p} Вт</div></div><div class="card"><div class="muted">Ток</div><div class="metric">${c.i.toFixed(1)} А</div></div></div><div class="card"><h2>Расчёт</h2><table class="table"><tr><td>Кабель</td><td>ВВГнг 3×${c.c} мм²</td></tr><tr><td>Автомат</td><td>${c.b} А</td></tr><tr><td>Напряжение</td><td>${state.voltage} В</td></tr></table></div></div>`}
function calcPage(){let c=calc();return `<div class="page"><h1>Расчёты</h1><div class="card"><table class="table"><tr><th>Показатель</th><th>Значение</th></tr><tr><td>Суммарная мощность</td><td>${c.p} Вт</td></tr><tr><td>Расчётный ток</td><td>${c.i.toFixed(2)} А</td></tr><tr><td>Кабель</td><td>ВВГнг 3×${c.c} мм²</td></tr><tr><td>Автомат</td><td>${c.b} А</td></tr></table></div><div class="card"><h3>По точкам</h3>${state.objects.map(o=>`<p>${TYPES[o.type][0]} ${esc(o.name)} — ${(o.power||0)*(o.count||1)} Вт</p>`).join('')}</div></div>`}
function panelPage(){let c=calc();return `<div class="page"><h1>Электрический щит</h1><div class="grid"><div class="card"><div class="muted">Вводной автомат</div><div class="metric">${c.b} А</div></div><div class="card"><div class="muted">УЗО</div><div class="metric">1</div></div><div class="card"><div class="muted">Шина PE</div><div class="metric">1</div></div><div class="card"><div class="muted">Шина N</div><div class="metric">1</div></div></div></div>`}
function materialsPage(){let c=calc(),rows=[['Кабель ВВГнг 3×'+c.c+' мм²',Math.ceil(state.objects.length*8*(1+state.reserve/100)),900],['Автомат '+c.b+' А',1,2500],['Подрозетник',state.objects.filter(o=>o.type==='outlet').length,400],['Распаячная коробка',state.objects.filter(o=>o.type==='junction').length,1200],['Электрощит',1,25000]],sum=rows.reduce((s,r)=>s+r[1]*r[2],0);return `<div class="page"><h1>Материалы</h1><div class="card"><table class="table"><tr><th>Материал</th><th>Кол.</th><th>Цена</th><th>Сумма</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2].toLocaleString()} ₸</td><td>${(r[1]*r[2]).toLocaleString()} ₸</td></tr>`).join('')}</table><h2>Итого: ${sum.toLocaleString()} ₸</h2></div></div>`}
function settingsPage(){return `<div class="page"><h1>Настройки</h1><div class="card"><div class="field"><label>Название проекта</label><input value="${esc(state.project)}" onchange="state.project=this.value;save()"></div><div class="field"><label>Напряжение, В</label><input type=number value="${state.voltage}" onchange="state.voltage=+this.value||230;save();render()"></div><div class="field"><label>Запас кабеля, %</label><input type=number value="${state.reserve}" onchange="state.reserve=+this.value||15;save();render()"></div><button onclick="exportJSON()">Экспорт JSON</button><button class="danger" onclick="localStorage.removeItem(KEY);location.reload()">Сбросить проект</button></div></div>`}
function changeZoom(d){state.zoom=Math.max(.5,Math.min(1.8,state.zoom+d));renderPlan();document.getElementById('zoom').textContent=Math.round(state.zoom*100)+'%'}function center(){document.getElementById('wrap').scrollTo({left:250,top:100,behavior:'smooth'})}function exportJSON(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='electromontazh-plan.json';a.click()}
function render(){side();toolbar();let c=document.getElementById('canvas'),p=document.getElementById('page');if(state.tab==='plan'){c.style.display='block';p.style.display='none';renderPlan();renderProps()}else{c.style.display='none';p.style.display='block';p.innerHTML=state.tab==='dashboard'?dashboard():state.tab==='calc'?calcPage():state.tab==='panel'?panelPage():state.tab==='materials'?materialsPage():settingsPage();document.getElementById('props').innerHTML='<span class="muted">Свойства доступны на плане.</span>'}}document.getElementById('canvas').addEventListener('pointerdown',ev=>{if(ev.target===ev.currentTarget){state.selected=null;render()}});render();
</script></body></html>
