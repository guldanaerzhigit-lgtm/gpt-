<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Электромонтаж дома PRO</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#eef2f7;color:#172033}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:9px 12px;cursor:pointer;background:#e2e8f0;color:#172033}button.primary{background:#2563eb;color:white}button.danger{background:#fee2e2;color:#b91c1c}.top{height:62px;background:#0f172a;color:#fff;display:flex;align-items:center;padding:0 16px;gap:8px}.logo{font-size:18px;font-weight:800}.spacer{flex:1}.app{display:flex;height:calc(100vh - 62px)}aside{width:235px;background:#fff;border-right:1px solid #dbe2ea;padding:12px;overflow:auto}.sec{font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;margin:14px 8px 7px}.nav,.tool{display:block;width:100%;text-align:left;margin:3px 0;background:#fff}.nav.active{background:#e8f0ff;color:#1d4ed8;font-weight:700}.main{flex:1;min-width:0;display:flex;flex-direction:column}.toolbar{height:58px;background:#fff;border-bottom:1px solid #dbe2ea;display:flex;align-items:center;gap:7px;padding:8px 12px;overflow:auto}.canvasWrap{flex:1;overflow:auto;background:#cbd5e1;padding:24px}.canvas{position:relative;width:1400px;height:850px;background:#fff;background-image:linear-gradient(#dbe4ee 1px,transparent 1px),linear-gradient(90deg,#dbe4ee 1px,transparent 1px);background-size:20px 20px;box-shadow:0 8px 30px #0002}.room{position:absolute;background:#fff;border:3px solid #475569;border-radius:5px;user-select:none;touch-action:none;cursor:move;z-index:5}.room.selected{border-color:#2563eb;box-shadow:0 0 0 3px #93c5fd}.rtitle{font-weight:800;padding:8px}.dims{padding:0 8px;color:#64748b;font-size:11px}.obj{position:absolute;transform:translate(-50%,-50%);width:36px;height:36px;border:2px solid #334155;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;z-index:30;cursor:grab;touch-action:none;user-select:none;box-shadow:0 2px 5px #0002}.obj.selected{border-color:#2563eb;box-shadow:0 0 0 3px #93c5fd}.outlet{border-radius:50%}.light{border-radius:50%;background:#fef3c7}.switch{background:#e0e7ff}.junction{border-radius:50%;background:#fee2e2}.panel{background:#dcfce7}.cablesSvg{position:absolute;inset:0;width:100%;height:100%;z-index:15;overflow:visible;pointer-events:none}.cableLine{fill:none;stroke:#ef4444;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke;cursor:pointer}.cableLine:hover{stroke-width:7}.cableLine.selected{stroke:#2563eb;stroke-width:7}.routePreview{fill:none;stroke:#2563eb;stroke-width:3;stroke-dasharray:8 6;pointer-events:none}.right{width:290px;background:#fff;border-left:1px solid #dbe2ea;padding:14px;overflow:auto}.field{margin:10px 0}.field label{display:block;color:#64748b;font-size:12px;margin-bottom:4px}.field input,.field select{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:12px}.metric{font-size:25px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid #eee;text-align:left}.page{padding:18px;overflow:auto}.muted{color:#64748b}.hint{background:#eff6ff;padding:10px;border-radius:9px;line-height:1.4;font-size:12px}.cableMode{background:#dbeafe!important;color:#1d4ed8!important;font-weight:700}.kbd{font-size:11px;background:#f1f5f9;padding:2px 6px;border-radius:5px}@media(max-width:900px){aside{display:none}.right{width:245px}.canvasWrap{padding:10px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.right{display:none}.top .logo{font-size:14px}.grid{grid-template-columns:1fr}.canvasWrap{padding:5px}}</style></head><body>
<header class="top"><div class="logo">⚡ Электромонтаж дома PRO</div><div class="spacer"></div><button onclick="save()">💾 Сохранить</button><button class="primary" onclick="exportJSON()">Экспорт JSON</button></header>
<div class="app"><aside id="side"></aside><main class="main"><div class="toolbar" id="toolbar"></div><div class="canvasWrap" id="wrap"><div id="canvas" class="canvas"></div><div id="page" class="page"></div></div></main><section class="right"><h3>Свойства</h3><div id="props"><span class="muted">Выберите объект на плане.</span></div></section></div>
<script>
const KEY='electromontazh-pro-v6',TYPES={outlet:['🔌','Розетка'],light:['💡','Светильник'],switch:['🔘','Выключатель'],junction:['⬡','Распаячная коробка'],panel:['▣','Электрощит']};
const initial={tab:'plan',project:'Мой дом',voltage:230,reserve:15,zoom:1,next:1000,rooms:[{id:1,name:'Гостиная',x:50,y:50,w:330,h:220},{id:2,name:'Кухня',x:410,y:50,w:320,h:220},{id:3,name:'Спальня',x:50,y:310,w:330,h:220},{id:4,name:'Санузел',x:410,y:310,w:220,h:190}],objects:[{id:101,type:'outlet',name:'Розетка TV',x:180,y:170,power:200,count:1},{id:102,type:'outlet',name:'Кухонная розетка',x:520,y:170,power:400,count:3},{id:103,type:'light',name:'Светильник',x:215,y:105,power:20,count:4},{id:104,type:'switch',name:'Выключатель',x:85,y:125,power:0,count:1},{id:105,type:'junction',name:'Распаячная коробка',x:350,y:275,power:0,count:1},{id:106,type:'panel',name:'Электрощит',x:820,y:120,power:0,count:1}],connections:[],cables:[]};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(initial);state.cables=state.cables||[];if(state.connections?.length&&!state.cables.length)state.cables=state.connections.map((c,i)=>({id:++state.next,name:'Кабель '+(i+1),from:c.a,to:c.b,points:[],type:'ВВГнг-LS',section:2.5,cores:3}));
let drag=null,route=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state));status('Сохранено')}function status(t){let e=document.getElementById('status');if(e)e.textContent=t}function esc(s){return String(s).replace(/[&<>\\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}function obj(id){return state.objects.find(o=>o.id===id)}function sel(){if(!state.selected)return null;if(state.selected.kind==='room')return state.rooms.find(r=>r.id===state.selected.id);if(state.selected.kind==='obj')return obj(state.selected.id);if(state.selected.kind==='cable')return state.cables.find(c=>c.id===state.selected.id);return null}
function addRoom(){let id=++state.next;state.rooms.push({id,name:'Новая комната',x:70,y:70,w:260,h:180});state.selected={kind:'room',id};save();render()}function addObj(type){cancelRoute();let id=++state.next;state.objects.push({id,type,name:TYPES[type][1],x:200,y:180,power:type==='outlet'?200:0,count:1});state.selected={kind:'obj',id};save();render()}function duplicate(){let a=sel();if(!a||state.selected.kind==='cable')return;if(state.selected.kind==='room'){let n={...a,id:++state.next,x:a.x+30,y:a.y+30,name:a.name+' копия'};state.rooms.push(n);state.selected={kind:'room',id:n.id}}else{let n={...a,id:++state.next,x:a.x+35,y:a.y+35,name:a.name+' копия'};state.objects.push(n);state.selected={kind:'obj',id:n.id}}save();render()}
function remove(){if(!state.selected)return;if(state.selected.kind==='cable')return deleteCable(state.selected.id);if(state.selected.kind==='room')state.rooms=state.rooms.filter(x=>x.id!==state.selected.id);else{let id=state.selected.id;state.objects=state.objects.filter(x=>x.id!==id);state.cables=state.cables.filter(c=>c.from!==id&&c.to!==id)}state.selected=null;save();render()}function deleteCable(id){state.cables=state.cables.filter(c=>c.id!==id);state.selected=null;cancelRoute();save();render();status('Кабель удалён')}function clearSel(){cancelRoute();state.selected=null;render()}
function startDrag(ev,kind,id){if(route)return;ev.preventDefault();ev.stopPropagation();let a=kind==='room'?state.rooms.find(x=>x.id===id):obj(id);state.selected={kind,id};drag={kind,id,startX:ev.clientX,startY:ev.clientY,x:a.x,y:a.y};try{ev.currentTarget.setPointerCapture(ev.pointerId)}catch(e){}renderObjectsOnly();renderProps()}function pointerMove(ev){if(!drag)return;let a=drag.kind==='room'?state.rooms.find(x=>x.id===drag.id):obj(drag.id);if(!a)return;let dx=(ev.clientX-drag.startX)/state.zoom,dy=(ev.clientY-drag.startY)/state.zoom;a.x=Math.max(0,Math.round(drag.x+dx));a.y=Math.max(0,Math.round(drag.y+dy));renderObjectsOnly();renderProps()}function pointerUp(){if(drag){save();drag=null;status('Положение сохранено')}}document.addEventListener('pointermove',pointerMove);document.addEventListener('pointerup',pointerUp);
function canvasPoint(ev){let c=document.getElementById('canvas'),r=c.getBoundingClientRect();return{x:Math.round((ev.clientX-r.left)/state.zoom),y:Math.round((ev.clientY-r.top)/state.zoom)}}
function toggleCableMode(){if(route)cancelRoute();else{route={from:null,points:[],cursor:null};state.selected=null;status('Кабель: выберите начальную точку')}render()}
function cancelRoute(){if(route){route=null;render()}}
function canvasClick(ev){if(!route)return;if(ev.target.closest('.obj')||ev.target.closest('.room')||ev.target.closest('.cableLine'))return;let p=canvasPoint(ev);route.points.push(p);route.cursor=p;renderPlan();status('Поворот добавлен. Кликните дальше или на конечную точку')}
function objectClick(ev,id){if(!route)return;ev.preventDefault();ev.stopPropagation();if(!route.from){route.from=id;route.points=[];status('Начало: '+(obj(id)?.name||'точка')+'. Добавляйте повороты или выберите конец');renderPlan();return}if(route.from===id){status('Конечная точка должна отличаться от начальной');return}let c={id:++state.next,name:'Кабель '+(state.cables.length+1),from:route.from,to:id,points:route.points.slice(),type:'ВВГнг-LS',section:2.5,cores:3};state.cables.push(c);state.selected={kind:'cable',id:c.id};route=null;save();render();status('Кабель создан')}
function cablePoints(c){let a=obj(c.from),b=obj(c.to);if(!a||!b)return[];return[{x:a.x,y:a.y},...(c.points||[]),{x:b.x,y:b.y}]}function pathD(ps){return ps.map((p,i)=>(i?'L':'M')+' '+p.x+' '+p.y).join(' ')}function cableLength(c){let ps=cablePoints(c),n=0;for(let i=1;i<ps.length;i++)n+=Math.hypot(ps[i].x-ps[i-1].x,ps[i].y-ps[i-1].y);return Math.round(n)}
function renderCables(){document.querySelector('.cablesSvg')?.remove();let c=document.getElementById('canvas');if(!c)return;let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.className='cablesSvg';svg.setAttribute('viewBox','0 0 1400 850');state.cables.forEach(con=>{let ps=cablePoints(con);if(ps.length<2)return;let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.classList.add('cableLine');if(state.selected?.kind==='cable'&&state.selected.id===con.id)p.classList.add('selected');p.setAttribute('d',pathD(ps));p.addEventListener('pointerdown',e=>{e.stopPropagation();state.selected={kind:'cable',id:con.id};renderProps();renderCables()});svg.appendChild(p)});if(route?.from){let a=obj(route.from),ps=[{x:a.x,y:a.y},...(route.points||[])];if(route.cursor)ps.push(route.cursor);let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.classList.add('routePreview');p.setAttribute('d',pathD(ps));svg.appendChild(p)}c.prepend(svg)}
function renderObjectsOnly(){let c=document.getElementById('canvas');if(!c||state.tab!=='plan')return;c.querySelectorAll('.room').forEach(e=>{let r=state.rooms.find(x=>x.id==e.dataset.id);if(r){e.style.left=r.x+'px';e.style.top=r.y+'px';e.style.width=r.w+'px';e.style.height=r.h+'px';e.classList.toggle('selected',state.selected?.kind==='room'&&state.selected.id===r.id)}});c.querySelectorAll('.obj').forEach(e=>{let o=obj(+e.dataset.id);if(o){e.style.left=o.x+'px';e.style.top=o.y+'px';e.classList.toggle('selected',state.selected?.kind==='obj'&&state.selected.id===o.id)}});renderCables()}
function side(){let items=[['dashboard','▦ Обзор'],['plan','⌗ План дома'],['calc','∑ Расчёты'],['panel','▣ Электрический щит'],['materials','▤ Материалы'],['settings','⚙ Настройки']];document.getElementById('side').innerHTML='<div class="sec">Проект</div>'+items.map(x=>`<button class="nav ${state.tab===x[0]?'active':''}" onclick="state.tab='${x[0]}';cancelRoute();render()">${x[1]}</button>`).join('')+'<div class="sec">План</div><button class="tool" onclick="addRoom()">🏠 Комната</button><div class="sec">Электроточки</div>'+Object.keys(TYPES).map(k=>`<button class="tool" onclick="addObj('${k}')">${TYPES[k][0]} ${TYPES[k][1]}</button>`).join('')+'<div class="sec">Редактор</div><button class="tool" onclick="duplicate()">⧉ Дублировать</button><button class="tool danger" onclick="remove()">🗑 Удалить</button><button class="tool" onclick="clearSel()">↗ Снять выделение</button><button class="tool '+(route?'cableMode':'')+'" onclick="toggleCableMode()">🔗 '+(route?'Завершить кабель':'Проложить кабель')+'</button><div class="sec">Управление кабелем</div><div class="hint">Включите «Проложить кабель». Нажмите на начальную точку → кликайте в местах поворота → нажмите на конечную точку. <span class="kbd">Esc</span> отменяет прокладку. Выберите красную линию и нажмите Delete для удаления.</div>'}
function toolbar(){document.getElementById('toolbar').innerHTML=state.tab==='plan'?`<button onclick="changeZoom(-.1)">−</button><span id="zoom">${Math.round(state.zoom*100)}%</span><button onclick="changeZoom(.1)">＋</button><button onclick="center()">⌂ Центр</button><button class="${route?'primary':''}" onclick="toggleCableMode()">🔗 ${route?'Рисование кабеля':'Кабель'}</button><span id="status" class="muted">${route?'Выберите точку на плане':'Готово'}</span>`:`<b>${pageTitle()}</b>`}function pageTitle(){return{dashboard:'Обзор',calc:'Расчёты',panel:'Электрический щит',materials:'Материалы',settings:'Настройки'}[state.tab]||'План дома'}
function renderPlan(){let c=document.getElementById('canvas');c.style.display='block';c.style.transform='scale('+state.zoom+')';c.style.transformOrigin='top left';c.innerHTML='';c.onclick=canvasClick;state.rooms.forEach(r=>{let e=document.createElement('div');e.className='room '+(state.selected?.kind==='room'&&state.selected.id===r.id?'selected':'');e.dataset.id=r.id;e.style.cssText=`left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`;e.innerHTML=`<div class="rtitle">${esc(r.name)}</div><div class="dims">${Math.round(r.w)} × ${Math.round(r.h)} мм</div>`;e.onpointerdown=ev=>startDrag(ev,'room',r.id);e.ondblclick=()=>{let n=prompt('Название комнаты',r.name);if(n){r.name=n;save();render()}};c.appendChild(e)});state.objects.forEach(o=>{let e=document.createElement('div');e.className='obj '+o.type+' '+(state.selected?.kind==='obj'&&state.selected.id===o.id?'selected':'');e.dataset.id=o.id;e.style.left=o.x+'px';e.style.top=o.y+'px';e.textContent=TYPES[o.type][0];e.title=o.name;e.onpointerdown=ev=>route?objectClick(ev,o.id):startDrag(ev,'obj',o.id);e.ondblclick=()=>{if(route)return;let n=prompt('Название',o.name);if(n){o.name=n;save();render()}};c.appendChild(e)});renderCables()}
function renderProps(){let p=document.getElementById('props'),a=sel();if(!a){p.innerHTML='<span class="muted">Выберите объект на плане.</span>';return}if(state.selected.kind==='cable'){p.innerHTML=`<div class="field"><label>Название</label><input value="${esc(a.name)}" onchange="cableProp('name',this.value)"></div><div class="field"><label>Тип кабеля</label><select onchange="cableProp('type',this.value)"><option ${a.type==='ВВГнг-LS'?'selected':''}>ВВГнг-LS</option><option ${a.type==='NYM'?'selected':''}>NYM</option><option ${a.type==='ПВС'?'selected':''}>ПВС</option></select></div><div class="field"><label>Сечение, мм²</label><input type=number step=.5 value="${a.section}" onchange="cableProp('section',this.value)"></div><div class="field"><label>Жилы</label><input type=number value="${a.cores}" onchange="cableProp('cores',this.value)"></div><div class="card"><b>Маршрут</b><div>${esc(obj(a.from)?.name||'—')} → ${esc(obj(a.to)?.name||'—')}</div><div class="metric">${cableLength(a)} мм</div><div class="muted">Длина по всем поворотам</div></div><button class="danger" style="width:100%" onclick="deleteCable(${a.id})">🗑 Удалить кабель</button>`;return}if(state.selected.kind==='room')p.innerHTML=`<div class="field"><label>Название</label><input value="${esc(a.name)}" onchange="setProp('name',this.value)"></div><div class="field"><label>X, мм</label><input type=number value="${a.x}" onchange="setProp('x',this.value)"></div><div class="field"><label>Y, мм</label><input type=number value="${a.y}" onchange="setProp('y',this.value)"></div><div class="field"><label>Ширина, мм</label><input type=number value="${a.w}" onchange="setProp('w',this.value)"></div><div class="field"><label>Высота, мм</label><input type=number value="${a.h}" onchange="setProp('h',this.value)"></div>`;else p.innerHTML=`<div class="field"><label>Название</label><input value="${esc(a.name)}" onchange="setProp('name',this.value)"></div><div class="field"><label>Тип</label><select onchange="changeType(this.value)">${Object.keys(TYPES).map(k=>`<option value="${k}" ${a.type===k?'selected':''}>${TYPES[k][1]}</option>`).join('')}</select></div><div class="field"><label>X, мм</label><input type=number value="${a.x}" onchange="setProp('x',this.value)"></div><div class="field"><label>Y, мм</label><input type=number value="${a.y}" onchange="setProp('y',this.value)"></div><div class="field"><label>Мощность, Вт</label><input type=number value="${a.power||0}" onchange="setProp('power',this.value)"></div><div class="field"><label>Количество</label><input type=number value="${a.count||1}" onchange="setProp('count',this.value)"></div><button class="danger" style="width:100%" onclick="remove()">🗑 Удалить</button>`}
function setProp(k,v){let a=sel();if(!a)return;a[k]=k==='name'?v:Number(v);save();render()}function cableProp(k,v){let a=sel();if(!a)return;a[k]=(k==='name'||k==='type')?v:Number(v);save();renderProps();renderCables()}function changeType(v){let a=sel();if(a?.type){a.type=v;a.name=TYPES[v][1];save();render()}}
function changeZoom(d){state.zoom=Math.min(1.6,Math.max(.5,Math.round((state.zoom+d)*10)/10));render()}function center(){document.getElementById('wrap').scrollTo({left:350,top:180,behavior:'smooth'})}function exportJSON(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='electromontazh-project.json';a.click();URL.revokeObjectURL(a.href)}
function renderPage(){let pg=document.getElementById('page'),c=document.getElementById('canvas');if(state.tab==='plan'){pg.style.display='none';renderPlan();return}c.style.display='none';pg.style.display='block';if(state.tab==='dashboard')pg.innerHTML=`<div class="grid"><div class="card"><div class="muted">Комнаты</div><div class="metric">${state.rooms.length}</div></div><div class="card"><div class="muted">Электроточки</div><div class="metric">${state.objects.length}</div></div><div class="card"><div class="muted">Кабели</div><div class="metric">${state.cables.length}</div></div><div class="card"><div class="muted">Длина кабеля</div><div class="metric">${Math.round(state.cables.reduce((s,c)=>s+cableLength(c),0)/1000*10)/10} м</div></div></div>`;else if(state.tab==='calc')pg.innerHTML=`<div class="card"><h2>Расчёты</h2><p>Общая мощность: <b>${state.objects.reduce((s,o)=>s+(o.power||0)*(o.count||1),0)} Вт</b></p><p>Кабельных маршрутов: <b>${state.cables.length}</b></p></div>`;else if(state.tab==='panel')pg.innerHTML='<div class="card"><h2>Электрический щит</h2><p>Настройка групп и автоматов доступна в проекте.</p></div>';else if(state.tab==='materials')pg.innerHTML=`<div class="card"><h2>Материалы</h2><table class="table"><tr><th>Материал</th><th>Количество</th></tr><tr><td>Кабель ВВГнг-LS</td><td>${Math.ceil(state.cables.reduce((s,c)=>s+cableLength(c),0)/1000)} м</td></tr><tr><td>Электроточки</td><td>${state.objects.length}</td></tr></table></div>`;else pg.innerHTML=`<div class="card"><h2>Настройки</h2><div class="field"><label>Название проекта</label><input value="${esc(state.project)}" onchange="state.project=this.value;save()"></div><div class="field"><label>Напряжение, В</label><input type=number value="${state.voltage}" onchange="state.voltage=Number(this.value);save()"></div></div>`}
function render(){side();toolbar();renderPage();renderProps()}document.addEventListener('keydown',e=>{if(e.key==='Escape'){cancelRoute();status('Прокладка отменена')}if((e.key==='Delete'||e.key==='Backspace')&&state.selected?.kind==='cable'){e.preventDefault();deleteCable(state.selected.id)}});render();
</script></body></html>
