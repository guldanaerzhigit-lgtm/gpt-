<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a">
<title>Электромонтаж дома PRO</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#f4f7fb;color:#172033}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.top{height:64px;background:#0f172a;color:#fff;display:flex;align-items:center;gap:18px;padding:0 22px;position:sticky;top:0;z-index:5}.logo{font-weight:800;font-size:18px}.top small{opacity:.65}.top .grow{flex:1}.btn{padding:9px 13px;border-radius:9px;background:#e2e8f0;color:#172033}.btn.primary{background:#2563eb;color:white}.btn.green{background:#16a34a;color:white}.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:230px;background:#fff;border-right:1px solid #e5e7eb;padding:15px 12px}.nav{width:100%;text-align:left;background:transparent;padding:12px;border-radius:9px;margin:3px 0;color:#475569}.nav.active{background:#e8f0ff;color:#1d4ed8;font-weight:700}.main{flex:1;padding:22px;max-width:1500px;margin:auto;width:100%}.title{display:flex;align-items:center;gap:12px;margin-bottom:18px}.title h1{font-size:25px;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:17px;box-shadow:0 3px 12px #0f172a08}.metric{font-size:28px;font-weight:800;margin-top:6px}.muted{color:#64748b;font-size:13px}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 11px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid #eef2f7;font-size:14px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e0f2fe;color:#0369a1;font-size:12px}.danger{color:#dc2626}.ok{color:#16a34a}.plan{position:relative;height:570px;background:#e9eef5;border-radius:14px;border:1px solid #d8dee8;overflow:hidden;background-image:linear-gradient(#dbe2eb 1px,transparent 1px),linear-gradient(90deg,#dbe2eb 1px,transparent 1px);background-size:25px 25px}.room{position:absolute;background:#fff;border:2px solid #64748b;border-radius:7px;padding:10px;box-shadow:0 5px 12px #0001;min-width:120px;min-height:80px;user-select:none}.room.sel{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb22}.point{position:absolute;width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid white;box-shadow:0 1px 5px #0005}.point:hover{transform:scale(1.25)}.two{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:#64748b;margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #d7dee8;border-radius:8px;background:white}.empty{text-align:center;padding:45px;color:#64748b}.toast{position:fixed;right:18px;bottom:18px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:20}.notice{padding:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;color:#9a3412;font-size:13px}.material-total{font-size:22px;font-weight:800}.mobile-nav{display:none}
@media(max-width:900px){aside{display:none}.mobile-nav{display:flex;overflow:auto;background:#fff;border-bottom:1px solid #e5e7eb;padding:8px}.mobile-nav .nav{white-space:nowrap;width:auto}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.main{padding:13px}.top{padding:0 12px}.top small{display:none}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.top .btn{padding:8px}.title{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div id="root"></div><div id="toast" class="toast"></div>
<script>
const KEY='electromontazh-pro-v2';
const EQUIP=[['LED светильник 20W',20,'light'],['Люстра 100W',100,'light'],['Прожектор 50W',50,'light'],['Обычная розетка',200,'socket'],['Двойная розетка',400,'socket'],['Выключатель',0,'switch'],['Холодильник',300,'power'],['Микроволновка',1500,'power'],['Электрочайник',2200,'power'],['Посудомоечная машина',2200,'power'],['Духовой шкаф',3500,'power'],['Электроплита',7000,'power'],['Стиральная машина',2200,'power'],['Бойлер',2000,'power'],['Кондиционер',1500,'power'],['Обогреватель',2000,'power']];
const demo=()=>({name:'Мой дом',voltage:230,cos:.95,reserve:15,material:'Медь',rooms:[['Гостиная',0,0,300,210],['Кухня',320,0,260,210],['Спальня',0,250,300,200],['Санузел',320,250,180,200]],points:[['Розетка TV',80,80,200,2,0],['Розетка кухонная',390,80,400,3,1],['Свет',150,20,20,4,0],['Холодильник',440,160,300,1,1],['Розетка спальня',100,330,200,3,2]],groups:[['Освещение',0],['Розетки',200],['Кухня',400],['Мощные приборы',3500]],tab:'dashboard',sel:0});
let S=JSON.parse(localStorage.getItem(KEY)||'null')||demo();
function save(){localStorage.setItem(KEY,JSON.stringify(S));toast('Проект сохранён')}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function uid(){return Date.now()+Math.random()}
function current(){let p=S.points.reduce((a,x)=>a+x[3]*x[4],0);return p/S.voltage}
function cable(i){if(i<=10)return 1.5;if(i<=16)return 2.5;if(i<=25)return 4;if(i<=32)return 6;if(i<=40)return 10;return 16}
function breaker(i){return [6,10,16,20,25,32,40,50,63].find(x=>x>=i)||63}
function calc(){let power=S.points.reduce((a,x)=>a+x[3]*x[4],0),i=power/S.voltage,c=cable(i);let mats=[];const add=(n,q,u='шт',p=0)=>{let x=mats.find(m=>m[0]===n);if(x)x[1]+=q;else mats.push([n,q,u,p])};S.points.forEach(x=>{add(x[0],x[4]);if(x[0].toLowerCase().includes('розет'))add('Подрозетник',x[4],'шт',400)});add('Кабель ВВГнг 3×'+c,Math.ceil(S.points.length*8*(1+S.reserve/100)),'м',700+c*300);add('Автомат вводной  '+breaker(i)+' А',1,'шт',2500);add('Электрощит',1,'шт',25000);return{power,i,c,b:breaker(i),mats,cost:mats.reduce((a,x)=>a+x[1]*x[3],0)}}
function nav(t){S.tab=t;render()}
function addRoom(){let n=prompt('Название комнаты','Новая комната');if(!n)return;S.rooms.push([n,40,40,220,160]);S.sel=S.rooms.length-1;save();render()}
function addPoint(){if(!S.rooms.length){toast('Сначала добавьте комнату');return}let n=prompt('Название точки','Новая розетка');if(!n)return;let p=prompt('Мощность, Вт','200');let q=prompt('Количество','1');S.points.push([n,80,80,+p||200,+q||1,0]);save();render()}
function removeRoom(){if(S.rooms.length){S.rooms.splice(S.sel,1);S.sel=Math.max(0,S.sel-1);save();render()}}
function exportJSON(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='electromontazh-project.json';a.click()}
function csv(){let rows=[['Материал','Количество','Ед.','Цена','Сумма'],...calc().mats.map(x=>[...x,x[1]*x[3]])];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(';')).join('\n')],{type:'text/csv;charset=utf-8'}));a.download='materials.csv';a.click()}
function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{S=JSON.parse(r.result);save();render()}catch{toast('Ошибка файла')}};r.readAsText(f)}
function header(){return `<header class="top"><div class="logo">⚡ Электромонтаж дома PRO</div><small>Проектирование • расчёт • материалы</small><div class="grow"></div><button class="btn" onclick="exportJSON()">JSON</button><button class="btn primary" onclick="save()">Сохранить</button></header>`}
function navs(mobile=false){let items=[['dashboard','Обзор','▦'],['plan','План дома','⌗'],['calc','Расчёты','∑'],['panel','Щит','▣'],['materials','Материалы','▤'],['settings','Настройки','⚙']];return items.map(x=>`<button class="nav ${S.tab===x[0]?'active':''}" onclick="nav('${x[0]}')">${x[2]} &nbsp;${x[1]}</button>`).join('')}
function dashboard(){let c=calc();return `<div class="title"><h1>Обзор проекта</h1><button class="btn green" onclick="addPoint()">＋ Электроточка</button><button class="btn" onclick="addRoom()">＋ Комната</button></div><div class="grid"><div class="card"><div class="muted">Помещения</div><div class="metric">${S.rooms.length}</div></div><div class="card"><div class="muted">Электроточки</div><div class="metric">${S.points.length}</div></div><div class="card"><div class="muted">Расчётная мощность</div><div class="metric">${Math.round(c.power)} Вт</div></div><div class="card"><div class="muted">Расчётный ток</div><div class="metric">${c.i.toFixed(1)} А</div></div></div><div class="section two"><div class="card"><h2>Группы</h2><table class="table"><tr><th>Группа</th><th>Мощность</th><th>Автомат</th><th>Кабель</th></tr>${S.groups.map(g=>`<tr><td>${g[0]}</td><td>${g[1]} Вт</td><td>${breaker(g[1]/S.voltage)} А</td><td>3×${cable(g[1]/S.voltage)} мм²</td></tr>`).join('')}</table></div><div class="card"><h2>Контроль проекта</h2><div class="notice">⚠️ Расчёты являются предварительными. Перед монтажом проверьте проект квалифицированным электриком с учётом ПУЭ и местных норм.</div><p class="muted">Материал: ${S.material} · Напряжение: ${S.voltage} В · Запас: ${S.reserve}%</p></div></div>`}
function plan(){return `<div class="title"><h1>План дома</h1><button class="btn primary" onclick="addRoom()">＋ Добавить комнату</button><button class="btn green" onclick="addPoint()">＋ Добавить точку</button></div><div class="two"><div class="plan">${S.rooms.map((r,i)=>`<div class="room ${S.sel===i?'sel':''}" style="left:${r[1]/1.8}px;top:${r[2]/1.2}px;width:${r[3]/1.8}px;height:${r[4]/1.2}px" onclick="S.sel=${i};render()"><b>${r[0]}</b><div class="muted">${r[3]}×${r[4]} см</div></div>`).join('')}${S.points.map(p=>`<div class="point" title="${p[0]} — ${p[3]} Вт" style="left:${p[1]/1.8}px;top:${p[2]/1.2}px"></div>`).join('')}</div><div class="card"><h2>Помещения</h2>${S.rooms.map((r,i)=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #eee"><button class="btn" onclick="S.sel=${i};render()">${i+1}. ${r[0]}</button>${S.sel===i?'<span class="badge">выбрано</span>':''}</div>`).join('')}<br><button class="btn" onclick="removeRoom()">Удалить выбранную</button></div></div>`}
function calcView(){let c=calc();return `<div class="title"><h1>Электрический расчёт</h1></div><div class="grid"><div class="card"><div class="muted">Суммарная мощность</div><div class="metric">${c.power.toFixed(0)} Вт</div></div><div class="card"><div class="muted">Ток</div><div class="metric">${c.i.toFixed(2)} А</div></div><div class="card"><div class="muted">Рекомендуемый кабель</div><div class="metric">3×${c.c} мм²</div></div><div class="card"><div class="muted">Автомат</div><div class="metric">${c.b} А</div></div></div><div class="section card"><h2>Электроточки</h2><table class="table"><tr><th>Точка</th><th>Мощность</th><th>Кол.</th><th>Итого</th></tr>${S.points.map(p=>`<tr><td>${p[0]}</td><td>${p[3]} Вт</td><td>${p[4]}</td><td>${p[3]*p[4]} Вт</td></tr>`).join('')}</table></div>`}
function panel(){let c=calc();return `<div class="title"><h1>Электрический щит</h1></div><div class="two"><div class="card"><h2>Однолинейная схема</h2><div class="empty">Ввод → <b>Автомат ${c.b} А</b> → УЗО → группы → потребители<br><br>${S.groups.map(g=>`<span class="badge">${g[0]} · ${breaker(g[1]/S.voltage)} А</span>`).join(' ')}</div></div><div class="card"><h2>Рекомендация</h2><p>Вводной автомат: <b>${c.b} А</b></p><p>Расчётный ток: <b>${c.i.toFixed(1)} А</b></p><p>Медь: <b>3×${c.c} мм²</b></p><div class="notice">Защитные устройства и сечения должны быть окончательно проверены по фактической нагрузке, длинам линий, способу прокладки и системе заземления.</div></div></div>`}
function materials(){let c=calc();return `<div class="title"><h1>Материалы</h1><button class="btn primary" onclick="csv()">Экспорт CSV</button></div><div class="card"><table class="table"><tr><th>Материал</th><th>Кол.</th><th>Ед.</th><th>Цена</th><th>Сумма</th></tr>${c.mats.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3].toLocaleString('ru-RU')} ₸</td><td>${(x[1]*x[3]).toLocaleString('ru-RU')} ₸</td></tr>`).join('')}</table><div style="text-align:right;margin-top:15px" class="material-total">Итого: ${c.cost.toLocaleString('ru-RU')} ₸</div></div>`}
function settings(){return `<div class="title"><h1>Настройки</h1></div><div class="card form"><div class="field"><label>Название проекта</label><input value="${S.name}" onchange="S.name=this.value;save()"></div><div class="field"><label>Напряжение, В</label><input type="number" value="${S.voltage}" onchange="S.voltage=+this.value||230;save();render()"></div><div class="field"><label>Коэффициент мощности cos φ</label><input type="number" step=".01" value="${S.cos}" onchange="S.cos=+this.value||.95;save()"></div><div class="field"><label>Запас кабеля, %</label><input type="number" value="${S.reserve}" onchange="S.reserve=+this.value||0;save()"></div><div class="field"><label>Материал кабеля</label><select onchange="S.material=this.value;save()"><option ${S.material==='Медь'?'selected':''}>Медь</option><option ${S.material==='Алюминий'?'selected':''}>Алюминий</option></select></div><div class="field"><label>Резервная копия</label><div class="row"><button class="btn" onclick="exportJSON()">Скачать JSON</button><label class="btn">Загрузить JSON<input type="file" accept=".json" onchange="importJSON(event)" hidden></label></div></div></div>`}
function render(){document.getElementById('root').innerHTML=header()+`<div class="mobile-nav">${navs(true)}</div><div class="layout"><aside>${navs()}</aside><main class="main">${S.tab==='dashboard'?dashboard():S.tab==='plan'?plan():S.tab==='calc'?calcView():S.tab==='panel'?panel():S.tab==='materials'?materials():settings()}</main></div>`}
render();
</script></body></html>
