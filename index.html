<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Электромонтаж дома PRO</title><style>*{box-sizing:border-box}body{margin:0;font:15px Arial;background:#f1f5f9;color:#172033}.top{height:64px;background:#0f172a;color:white;display:flex;align-items:center;padding:0 18px;gap:14px}.logo{font-size:19px;font-weight:800}.grow{flex:1}button{border:0;border-radius:9px;padding:9px 13px;cursor:pointer}button.primary{background:#2563eb;color:#fff}button.green{background:#16a34a;color:#fff}.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:220px;background:#fff;padding:12px;border-right:1px solid #ddd}.nav{display:block;width:100%;text-align:left;background:white;margin:3px 0}.nav.active{background:#e8f0ff;color:#1d4ed8;font-weight:bold}.main{padding:22px;max-width:1400px;width:100%;margin:auto}.title{display:flex;gap:10px;align-items:center;margin-bottom:18px}.title h1{flex:1}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:16px;box-shadow:0 3px 12px #0000000a}.muted{color:#64748b;font-size:13px}.metric{font-size:27px;font-weight:800;margin-top:7px}.two{display:grid;grid-template-columns:1.6fr 1fr;gap:15px;margin-top:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #eee}.plan{height:560px;position:relative;overflow:hidden;border-radius:14px;background:#e7edf4;background-image:linear-gradient(#d5dde7 1px,transparent 1px),linear-gradient(90deg,#d5dde7 1px,transparent 1px);background-size:25px 25px}.room{position:absolute;background:#fff;border:2px solid #64748b;border-radius:7px;padding:9px;min-width:110px;min-height:70px}.room.sel{border-color:#2563eb}.point{position:absolute;width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid white;transform:translate(-50%,-50%)}.notice{padding:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;color:#9a3412}.mobile{display:none;background:#fff;padding:7px;overflow:auto}.mobile .nav{display:inline-block;width:auto;white-space:nowrap}.toast{position:fixed;right:18px;bottom:18px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;display:none}@media(max-width:850px){aside{display:none}.mobile{display:block}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.main{padding:13px}}@media(max-width:500px){.grid{grid-template-columns:1fr}.top small{display:none}}</style></head><body><div id="root"></div><div id="toast" class="toast"></div><script>const K='electromontazh-pro';let S=JSON.parse(localStorage.getItem(K)||'null')||{name:'Мой дом',tab:'home',voltage:230,reserve:15,rooms:[{n:'Гостиная',x:30,y:30,w:260,h:180},{n:'Кухня',x:330,y:30,w:250,h:180},{n:'Спальня',x:30,y:250,w:260,h:180},{n:'Санузел',x:330,y:250,w:180,h:180}],points:[{n:'Розетка TV',x:100,y:100,p:200,q:2},{n:'Кухонная розетка',x:400,y:100,p:400,q:3},{n:'Свет',x:150,y:55,p:20,q:4},{n:'Холодильник',x:470,y:155,p:300,q:1}]};function save(){localStorage.setItem(K,JSON.stringify(S));toast('Сохранено')}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1600)}function calc(){let p=S.points.reduce((a,x)=>a+x.p*x.q,0),i=p/S.voltage,c=i<=10?1.5:i<=16?2.5:i<=25?4:i<=32?6:i<=40?10:16,b=[6,10,16,20,25,32,40,50,63,80,100].find(x=>x>=i)||100;return{p,i,c,b}}function nav(t){S.tab=t;save();render()}function addRoom(){let n=prompt('Название комнаты','Новая комната');if(!n)return;S.rooms.push({n,x:40,y:40,w:220,h:160});save();render()}function addPoint(){let n=prompt('Название точки','Розетка');if(!n)return;let p=+prompt('Мощность, Вт','200')||200,q=+prompt('Количество','1')||1;S.points.push({n,x:100,y:100,p,q});save();render()}function jsonOut(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='electromontazh.json';a.click()}function dashboard(){let c=calc();return `<div class=title><h1>${S.name}</h1><button class=green onclick=addPoint()>＋ Точка</button><button onclick=addRoom()>＋ Комната</button></div><div class=grid><div class=card><div class=muted>Комнаты</div><div class=metric>${S.rooms.length}</div></div><div class=card><div class=muted>Точки</div><div class=metric>${S.points.length}</div></div><div class=card><div class=muted>Мощность</div><div class=metric>${c.p} Вт</div></div><div class=card><div class=muted>Ток</div><div class=metric>${c.i.toFixed(1)} А</div></div></div><div class=two><div class=card><h2>Расчёт</h2><table class=table><tr><td>Кабель</td><td>ВВГнг 3×${c.c} мм²</td></tr><tr><td>Автомат</td><td>${c.b} А</td></tr><tr><td>Напряжение</td><td>${S.voltage} В</td></tr></table></div><div class=card><h2>Важно</h2><div class=notice>Предварительный расчёт. Перед монтажом необходима проверка квалифицированным электриком и по действующим нормам.</div></div></div>`}function plan(){return `<div class=title><h1>План дома</h1><button class=primary onclick=addRoom()>＋ Комната</button><button class=green onclick=addPoint()>＋ Точка</button></div><div class=two><div class=plan>${S.rooms.map(r=>`<div class=room style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px"><b>${r.n}</b><div class=muted>${r.w}×${r.h} см</div></div>`).join('')}${S.points.map(p=>`<div class=point title="${p.n}" style="left:${p.x}px;top:${p.y}px"></div>`).join('')}</div><div class=card><h2>Электроточки</h2>${S.points.map(p=>`<p>${p.n} — ${p.p} Вт × ${p.q}</p>`).join('')}</div></div>`}function calcPage(){let c=calc();return `<div class=title><h1>Расчёты</h1></div><div class=card><table class=table><tr><th>Показатель</th><th>Значение</th></tr><tr><td>Суммарная мощность</td><td>${c.p} Вт</td></tr><tr><td>Расчётный ток</td><td>${c.i.toFixed(2)} А</td></tr><tr><td>Кабель</td><td>3×${c.c} мм²</td></tr><tr><td>Автомат</td><td>${c.b} А</td></tr></table></div><div class=card style="margin-top:15px"><h2>Точки</h2>${S.points.map(p=>`<p>${p.n}: ${p.p*p.q} Вт</p>`).join('')}</div>`}function panel(){let c=calc();return `<div class=title><h1>Электрический щит</h1></div><div class=grid><div class=card><div class=muted>Вводной автомат</div><div class=metric>${c.b} А</div></div><div class=card><div class=muted>УЗО</div><div class=metric>1</div></div><div class=card><div class=muted>Шина PE</div><div class=metric>1</div></div><div class=card><div class=muted>Шина N</div><div class=metric>1</div></div></div>`}function materials(){let c=calc(),m=[['Кабель ВВГнг 3×'+c.c,Math.ceil(S.points.length*8*(1+S.reserve/100)),900],['Автомат '+c.b+' А',1,2500],['Подрозетник',S.points.length,400],['Электрощит',1,25000]],sum=m.reduce((a,x)=>a+x[1]*x[2],0);return `<div class=title><h1>Материалы</h1></div><div class=card><table class=table><tr><th>Материал</th><th>Кол.</th><th>Цена</th><th>Сумма</th></tr>${m.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2].toLocaleString()} ₸</td><td>${(x[1]*x[2]).toLocaleString()} ₸</td></tr>`).join('')}</table><h2>Итого: ${sum.toLocaleString()} ₸</h2></div>`}function settings(){return `<div class=title><h1>Настройки</h1></div><div class=card><p>Название проекта</p><input value="${S.name}" onchange="S.name=this.value;save()" style="padding:9px;width:100%"><p>Напряжение</p><input type=number value=${S.voltage} onchange="S.voltage=+this.value||230;save();render()" style="padding:9px;width:100%"><p>Запас кабеля, %</p><input type=number value=${S.reserve} onchange="S.reserve=+this.value||15;save();render()" style="padding:9px;width:100%"><p><button onclick=jsonOut()>Экспорт JSON</button><button onclick="localStorage.removeItem(K);location.reload()">Сбросить</button></p></div>`}function navs(){return [['home','▦ Обзор'],['plan','⌗ План дома'],['calc','∑ Расчёты'],['panel','▣ Щит'],['materials','▤ Материалы'],['settings','⚙ Настройки']].map(x=>`<button class="nav ${S.tab===x[0]?'active':''}" onclick="nav('${x[0]}')">${x[1]}</button>`).join('')}function render(){let b=S.tab==='home'?dashboard():S.tab==='plan'?plan():S.tab==='calc'?calcPage():S.tab==='panel'?panel():S.tab==='materials'?materials():settings();document.getElementById('root').innerHTML=`<header class=top><div class=logo>⚡ Электромонтаж дома PRO</div><div class=grow></div><button onclick=jsonOut()>JSON</button><button class=primary onclick=save()>Сохранить</button></header><div class=mobile>${navs()}</div><div class=layout><aside>${navs()}</aside><main class=main>${b}</main></div>`}render();</script></body></html>
